<h2 mat-dialog-title>
    {{ data ? 'Edit Project' : 'Add Project' }}
</h2>

<mat-dialog-content>

    <form [formGroup]="form">

        <mat-form-field appearance="outline">

            <mat-label>Name</mat-label>

            <input
                matInput
                formControlName="name">

        </mat-form-field>

        <mat-form-field appearance="outline">

            <mat-label>Description</mat-label>

            <textarea
                matInput
                rows="4"
                formControlName="description">
            </textarea>

        </mat-form-field>

    </form>

</mat-dialog-content>

<mat-dialog-actions align="end">

    <button
        mat-button
        (click)="cancel()">

        Cancel

    </button>

    <button
        mat-raised-button
        color="primary"
        (click)="save()">

        Save

    </button>

</mat-dialog-actions>

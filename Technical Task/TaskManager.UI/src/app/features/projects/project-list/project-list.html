
<mat-card>

    <mat-card-header>

        <mat-card-title>
            Projects
        </mat-card-title>

    </mat-card-header>


    <mat-card-content>

        <div class="toolbar">

            <button
                mat-raised-button
                color="primary"
                (click)="openCreateDialog()">

                Add Project

            </button>

        </div>


        <table class="project-table">

            <thead>

                <tr>

                    <th>Name</th>
                    <th>Description</th>
                    <th>Created</th>
                    <th>Actions</th>

                </tr>

            </thead>


            <tbody>

                @for (project of projects; track project.id) {

                <tr>

                    <td>
                        {{ project.name }}
                    </td>


                    <td>
                        {{ project.description }}
                    </td>


                    <td>
                        {{ project.createdAt | date:'shortDate' }}
                    </td>


                   <td>

    <button 
        mat-button
        color="accent"
        (click)="viewTasks(project.id)">

        Tasks

    </button>

    <button
        mat-icon-button
        color="primary"
        (click)="openEditDialog(project)">

        <mat-icon>edit</mat-icon>

    </button>

    <button
        mat-icon-button
        color="warn"
        (click)="deleteProject(project.id)">

        <mat-icon>delete</mat-icon>

    </button>

</td>

                </tr>

                }

            </tbody>


        </table>


    </mat-card-content>


</mat-card>

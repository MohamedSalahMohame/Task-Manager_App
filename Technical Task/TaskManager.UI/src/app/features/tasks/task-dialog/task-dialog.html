<h2 mat-dialog-title>Add Task</h2>

<mat-dialog-content>

    <form [formGroup]="form">

        <mat-form-field appearance="outline">

            <mat-label>Title</mat-label>

            <input
                matInput
                formControlName="title">

        </mat-form-field>

        <mat-form-field appearance="outline">

            <mat-label>Description</mat-label>

            <textarea
                matInput
                rows="4"
                formControlName="description">
            </textarea>

        </mat-form-field>

        <mat-form-field appearance="outline">

            <mat-label>Due Date</mat-label>

            <input
                matInput
                [matDatepicker]="picker"
                formControlName="dueDate">

            <mat-datepicker-toggle
                matIconSuffix
                [for]="picker">
            </mat-datepicker-toggle>

            <mat-datepicker #picker></mat-datepicker>

        </mat-form-field>

        <mat-form-field appearance="outline">

            <mat-label>Status</mat-label>

            <mat-select formControlName="status">

                <mat-option [value]="0">
                    To Do
                </mat-option>

                <mat-option [value]="1">
                    In Progress
                </mat-option>

                <mat-option [value]="2">
                    Done
                </mat-option>

            </mat-select>

        </mat-form-field>

    </form>

</mat-dialog-content>

<mat-dialog-actions align="end">

    <button
        mat-button
        (click)="cancel()">

        Cancel

    </button>

    <button
        mat-raised-button
        color="primary"
        (click)="save()">

        Save

    </button>

</mat-dialog-actions>
